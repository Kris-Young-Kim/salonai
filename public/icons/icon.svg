<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo Letter 'U' & Scissors Accent -->
  <g transform="translate(136, 120)">
    <!-- Stylized U Shape -->
    <path d="M 40 40 
             L 40 160 
             C 40 230, 80 260, 120 260 
             C 160 260, 200 230, 200 160 
             L 200 40 
             L 160 40 
             L 160 160 
             C 160 195, 145 220, 120 220 
             C 95 220, 80 195, 80 160 
             L 80 40 Z" 
          fill="url(#goldGrad)" filter="url(#glow)"/>
          
    <!-- AI Sparkle Top Right -->
    <path d="M 195 25 Q 195 45 215 45 Q 195 45 195 65 Q 195 45 175 45 Q 195 45 195 25 Z" 
          fill="#fef08a"/>
    <path d="M 45 225 Q 45 238 58 238 Q 45 238 45 251 Q 45 238 32 238 Q 45 238 45 225 Z" 
          fill="#fef08a"/>
  </g>
</svg>
